<!doctypehtml><html lang=vi><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,viewport-fit=cover"name=viewport><title>Tiến Lên</title><style>:root{--bg:#f7f5ef;--ink:#17171b;--pencil:#8a8781;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#15161b;--ink:#e6e2d6;--pencil:#8f8c86;color-scheme:dark}}body,html{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}canvas#canvas{display:block;position:fixed;inset:0;width:100%;height:100%;outline:0}#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center}#loading b{display:block;font-size:28px;letter-spacing:.06em}#loading span{color:var(--pencil);font-size:14px}#bar{width:220px;height:4px;margin:14px auto 0;border:1px solid var(--ink)}#bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}</style></head><body><div id=loading><div><b>TIẾN LÊN</b><span id=status>Đang tải…</span><div id=bar><i id=fill></i></div></div></div><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><script>var statusEl=document.getElementById("status"),fill=document.getElementById("fill"),Module={canvas:document.getElementById("canvas"),setStatus:function(t){var e=t&&t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);e?(fill.style.width=100*e[1]/e[3]+"%",statusEl.textContent="Đang tải dữ liệu…"):t||document.getElementById("loading").remove()},printErr:function(t){console.error(t)}};window.addEventListener("keydown",(function(t){["Space","Tab","F2","F5","Backquote"].indexOf(t.code)>=0&&t.preventDefault()}))</script><script async src=index.js></script></body></html>
